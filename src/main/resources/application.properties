spring.application.name=community-store-backend
server.port=8080

# Local database for running the application without external services
spring.datasource.url=jdbc:h2:mem:community_store_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
